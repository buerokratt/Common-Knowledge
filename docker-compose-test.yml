name: cleaning-test

services:

  # ── Vault (dev mode: in-memory, auto-unsealed, root token = "root") ──────────
  vault-test:
    image: hashicorp/vault:1.21.3
    container_name: vault-test
    restart: "no"
    command:
      - vault
      - server
      - -dev
      - -dev-root-token-id=root
      - -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    ports:
      - "18200:8200"
    networks:
      - cleaning-test-network
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ── Mock Ruuter ───────────────────────────────────────────────────────────────
  mock-ruuter:
    image: python:3.12-slim
    container_name: mock-ruuter-test
    restart: "no"
    command:
      - python
      - -c
      - |
        import json
        from http.server import HTTPServer, BaseHTTPRequestHandler
        from urllib.parse import urlparse

        calls = []

        class Handler(BaseHTTPRequestHandler):
            def log_message(self, *a): pass

            def do_POST(self):
                length = int(self.headers.get('Content-Length', 0))
                body = json.loads(self.rfile.read(length)) if length else {}
                path = urlparse(self.path).path
                calls.append({'path': path, 'body': body})

                if 'upload-file-sync' in path:
                    resp = json.dumps({'response': 'http://mock-storage/cleaned.txt'}).encode()
                else:
                    resp = json.dumps({'status': 'ok'}).encode()

                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(resp)))
                self.end_headers()
                self.wfile.write(resp)

            def do_GET(self):
                path = urlparse(self.path).path
                if path == '/calls':
                    resp = json.dumps(calls).encode()
                elif path == '/reset':
                    calls.clear()
                    resp = b'{"status":"reset"}'
                elif path == '/health':
                    resp = b'ok'
                else:
                    resp = b'{}'
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(resp)))
                self.end_headers()
                self.wfile.write(resp)

        print('Mock Ruuter listening on :8089', flush=True)
        HTTPServer(('0.0.0.0', 8089), Handler).serve_forever()
    ports:
      - "18089:8089"
    networks:
      - cleaning-test-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Cleaning Server (service under test) ─────────────────────────────────────
  # Note: no vault-agent needed. conftest.py creates a service token via hvac
  # and writes it directly to ./test-vault/agent-out/token (bind-mounted here).
  # The cleaning server reads it at VAULT_TOKEN_PATH just as in production.
  cleaning-server-test:
    container_name: cleaning-server-test
    build:
      context: ./cleaning
      dockerfile: Dockerfile
    ports:
      - "18001:8123"
    volumes:
      - ./test-scrapped-data:/scrapped-data
      - ./test-vault/agent-out:/agent/out:ro
    environment:
      - RUUTER_INTERNAL=http://mock-ruuter-test:8089
      - VAULT_ADDR=http://vault-test:8200
      - VAULT_TOKEN_PATH=/agent/out/token
      - VAULT_SECRET_PATH=llm/connections/azure_openai/cleaner
      - LANGUAGES=["est","rus","eng"]
      - SKIP_CLEANUP=true
    networks:
      - cleaning-test-network
    depends_on:
      vault-test:
        condition: service_healthy
      mock-ruuter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8123/docs').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  cleaning-test-network:
    name: cleaning-test-network
    driver: bridge