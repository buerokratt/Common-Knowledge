name: Build and publish service images

on:
  push:
    branches:
      - dev
    paths:
      - '.env.dev'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Docker Setup BuildX
        uses: docker/setup-buildx-action@v2

      - name: Load environment variables
        run: |
          if [ -f .env.dev ]; then
            export $(cat .env.dev | grep -v '^#' | xargs)
          fi
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "FIX=$FIX" >> $GITHUB_ENV

      - name: Set image info
        run: |
          LOWER_CASE_GITHUB_REPOSITORY=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PACKAGE=ghcr.io/${LOWER_CASE_GITHUB_REPOSITORY}" >> $GITHUB_ENV
          TAG_VERSION=$RELEASE-$VERSION.$BUILD.$FIX
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Log in to GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Build & Push each service under one repo package
        run: |
          for SERVICE in $(docker-compose config --services); do
            # Check if service has a build context
            IMAGE_DEFINED=$(docker-compose config | awk -v srv="$SERVICE" '
              $1=="services:" {in_services=1}
              in_services && $1==srv":" {in_service=1}
              in_service && $1=="image:" {print $2; exit}
              in_service && /^[^[:space:]]/ {in_service=0}
            ')

            if [ -z "$IMAGE_DEFINED" ]; then
              echo "🔨 Building $SERVICE..."
              docker-compose build $SERVICE

              # Push two tags per service under the same package
              docker tag $SERVICE $IMAGE_PACKAGE:$SERVICE-dev
              docker push $IMAGE_PACKAGE:$SERVICE-dev

              docker tag $SERVICE $IMAGE_PACKAGE:$SERVICE-$TAG_VERSION
              docker push $IMAGE_PACKAGE:$SERVICE-$TAG_VERSION

              echo "✅ Pushed $SERVICE images under $IMAGE_PACKAGE"
            else
              echo "⏭️ Skipping $SERVICE (external image: $IMAGE_DEFINED)"
            fi
          done
