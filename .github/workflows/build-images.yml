name: Build and publish service images

on:
  push:
    branches:
      - dev
    paths:
      - '.env.dev'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Docker Setup BuildX
        uses: docker/setup-buildx-action@v2

      - name: Load environment variables
        run: |
          if [ -f .env.dev ]; then
            export $(cat .env.dev | grep -v '^#' | xargs)
          fi
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "FIX=$FIX" >> $GITHUB_ENV

      - name: Prepare repo owner
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> $GITHUB_ENV
          TAG_VERSION=$RELEASE-$VERSION.$BUILD.$FIX
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Log in to GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Build & Push each service image
        run: |
          for SERVICE in $(docker-compose config --services); do
            IMAGE=$(docker-compose config | awk -v srv="$SERVICE" '
              $1=="services:" {in_services=1}
              in_services && $1==srv":" {in_service=1}
              in_service && $1=="image:" {print $2; exit}
              in_service && /^[^[:space:]]/ {in_service=0}
            ')

            if [ -z "$IMAGE" ]; then
              echo "🔨 Building $SERVICE..."
              docker-compose build $SERVICE

              IMAGE_NAME=ghcr.io/${OWNER}/common-knowledge-${SERVICE}:${TAG_VERSION}
              docker tag ${SERVICE} $IMAGE_NAME
              docker push $IMAGE_NAME

              # optional moving tag for convenience
              docker tag ${SERVICE} ghcr.io/${OWNER}/common-knowledge-${SERVICE}:dev
              docker push ghcr.io/${OWNER}/common-knowledge-${SERVICE}:dev

              echo "✅ Pushed $IMAGE_NAME"
            else
              echo "⏭️ Skipping $SERVICE (already has image: $IMAGE)"
            fi
          done
