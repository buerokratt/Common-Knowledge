name: Check Version

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Docker Setup BuildX
        uses: docker/setup-buildx-action@v2

      - name: Generate Changelog
        run: npm run changelog

      - name: Load environment variables
        run: |
          awk -v branch="${{ env.BRANCH }}" ' /^[0-9a-zA-Z]+$/ { current_branch = $0; } current_branch == branch && /^[A-Z_]+=/{ print $0; }' release.env >> $GITHUB_ENV

      - name: Set repo
        run: |
           LOWER_CASE_GITHUB_REPOSITORY=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')
           echo "DOCKER_TAG_CUSTOM=ghcr.io/${LOWER_CASE_GITHUB_REPOSITORY}:v${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}" >> $GITHUB_ENV
           echo "$GITHUB_ENV"

      - name: Build GUI image
        run: |
          echo "Building Docker image for branch: ${{ env.BRANCH }} major: ${{ env.MAJOR }} minor: ${{ env.MINOR }} patch: ${{ env.PATCH }}"
          cd GUI && docker image build --tag $DOCKER_TAG_CUSTOM --no-cache .

      - name: Build cleaning-server image
        run: |
          echo "Building Docker image for branch: ${{ env.BRANCH }} major: ${{ env.MAJOR }} minor: ${{ env.MINOR }} patch: ${{ env.PATCH }}"
          docker image build --tag $DOCKER_TAG_CUSTOM-cleaning-server -f cleaning/Dockerfile --no-cache .

      - name: Build file-processing-api image
        run: |
          echo "Building Docker image for branch: ${{ env.BRANCH }} major: ${{ env.MAJOR }} minor: ${{ env.MINOR }} patch: ${{ env.PATCH }}"
          docker image build --tag $DOCKER_TAG_CUSTOM-file-processing-api -f file-processing/Dockerfile --no-cache .

      - name: Build search-service image
        run: |
          echo "Building Docker image for branch: ${{ env.BRANCH }} major: ${{ env.MAJOR }} minor: ${{ env.MINOR }} patch: ${{ env.PATCH }}"
          cd search-service && docker image build --tag $DOCKER_TAG_CUSTOM-search-service --no-cache .

      - name: Build scrapper-server image
        run: |
          echo "Building Docker image for branch: ${{ env.BRANCH }} major: ${{ env.MAJOR }} minor: ${{ env.MINOR }} patch: ${{ env.PATCH }}"
          docker image build --tag $DOCKER_TAG_CUSTOM-scrapper-server -f scrapper/Dockerfile --target server --no-cache .

      - name: Build scrapper-celery image
        run: |
          echo "Building Docker image for branch: ${{ env.BRANCH }} major: ${{ env.MAJOR }} minor: ${{ env.MINOR }} patch: ${{ env.PATCH }}"
          docker image build --tag $DOCKER_TAG_CUSTOM-scrapper-celery -f scrapper/Dockerfile --target celery --no-cache .

      - name: Log in to GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Push GUI image to GitHub Packages
        run: docker push $DOCKER_TAG_CUSTOM

      - name: Push cleaning-server image to GitHub Packages
        run: docker push $DOCKER_TAG_CUSTOM-cleaning-server

      - name: Push file-processing-api image to GitHub Packages
        run: docker push $DOCKER_TAG_CUSTOM-file-processing-api

      - name: Push search-service image to GitHub Packages
        run: docker push $DOCKER_TAG_CUSTOM-search-service

      - name: Push scrapper-server image to GitHub Packages
        run: docker push $DOCKER_TAG_CUSTOM-scrapper-server

      - name: Push scrapper-celery image to GitHub Packages
        run: docker push $DOCKER_TAG_CUSTOM-scrapper-celery

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}
          generate_release_notes: true
          body_path: ${{ github.workspace }}/CHANGELOG.md
