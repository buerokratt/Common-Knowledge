name: Build and publish GUI

on:
  push:
    branches: [ dev ]
    paths:
      - '.env.scrapper'

jobs:
  PackageDeploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debugging Step
        run: |
          echo "Checking runner status..."
          # Add more debugging commands as needed
          
      - uses: actions/checkout@v2

      - name: Docker Setup BuildX
        uses: docker/setup-buildx-action@v2

      - name: Load environment variables and set them
        run: |
          if [ -f .env.scrapper ]; then
            export $(cat .env.scrapper | grep -v '^#' | xargs)
          fi
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "FIX=$FIX" >> $GITHUB_ENV
      - name: Set repo
        run: |
           LOWER_CASE_GITHUB_REPOSITORY=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')
           echo "DOCKER_TAG_CUSTOM=ghcr.io/${LOWER_CASE_GITHUB_REPOSITORY}:server-$RELEASE-$VERSION.$BUILD.$FIX" >> $GITHUB_ENV
           echo "DOCKER_TAG_CELERY=ghcr.io/${LOWER_CASE_GITHUB_REPOSITORY}:celery-$RELEASE-$VERSION.$BUILD.$FIX" >> $GITHUB_ENV
           echo "$GITHUB_ENV"
      - name: Docker Build server
        run: | 
           cd scrapper
           docker build --tag $DOCKER_TAG_CUSTOM --target server .
      - name: Docker build celery
        run: |
          cd scrapper
          docker build --tag $DOCKER_TAG_CELERY --target celery .

      - name: Log in to GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Push server image
        run: docker push $DOCKER_TAG_CUSTOM
      - name: Push celery image
        run: docker push $DOCKER_TAG_CELERY
