[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short
# Stop after first failure in CI to preserve logs
# Override with -x flag in local runs if needed
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:unstructured.*
 