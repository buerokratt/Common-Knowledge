[pytest]
testpaths = tests
# tests/test_tasks.py imports `from worker.tasks ...`; worker lives under
# cleaning/, so put cleaning/ on sys.path the same way runtime does
# (Dockerfile WORKDIR=/app + COPY cleaning/ /app/).
pythonpath = cleaning
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short
# Stop after first failure in CI to preserve logs
# Override with -x flag in local runs if needed
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:unstructured.*
 