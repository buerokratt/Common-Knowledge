[pytest]
testpaths = tests
# Each service root goes on sys.path the same way runtime does (Dockerfile
# WORKDIR=/app + COPY <service>/ /app/), so tests import exactly what the
# container does.
#   cleaning/         -> api, worker   (tests/test_tasks.py)
#   content-external/ -> exporter      (tests/test_exporter_*.py)
# Only these two are listed because only these two have tests. Adding a third
# service is not automatically safe: cleaning/ and scrapper/ both own `api`
# and `worker`, and data-export/ and file-processing/ both own `app`, so the
# first entry would silently shadow the others. The single top-level
# `exporter` package (A1, Finding 9) is what makes content-external safe.
pythonpath = cleaning content-external
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short
# Stop after first failure in CI to preserve logs
# Override with -x flag in local runs if needed
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:unstructured.*
 