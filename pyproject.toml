[project]
name = "common-knowledge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    # Shared across services
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pydantic-settings==2.10.1",
    "requests==2.32.4",

    # Cleaning service
    "unstructured[pdf,docx,doc]==0.18.5",
    "beautifulsoup4==4.13.4",
    "langdetect==1.0.9",
    "trafilatura==2.0.0",
    "markdownify==0.14.1",
    "openai==1.82.0",
    "pymupdf4llm==0.0.17",
    "PyMuPDF==1.25.5",
    "python-pptx==1.0.2",
    "python-docx==1.1.2",

    # Scrapper service
    "scrapy==2.13.2",
    "celery==5.5.3",
    "scrapy-playwright==0.0.43",
    "fake-useragent==2.2.0",

    # File-processing service
    "boto3==1.34.0",
    "python-multipart==0.0.6",
    "psycopg2-binary==2.9.10",
    "PyYAML==6.0.2",

    # Scheduler service
    "croniter==6.0.0",
    "pytz==2026.1.post1",
]

[dependency-groups]
dev = [
    "ruff==0.8.6",
    "pyright==1.1.391",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-timeout==2.3.1",
    "hvac==2.3.0",
    "loguru==0.7.2",
    "pre-commit==4.1.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "GUI",
    "search-service",
]

# Same as Black Formatter.
line-length = 88
indent-width = 4

# Set Python Version - 3.12
target-version = "py312"

fix = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "T20", "N", "ANN", "ERA", "PERF"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pyright]
# --- Environment & discovery ---
pythonVersion = "3.12.10"          # Target Python semantics.
venvPath = "."                     # Where virtual envs live relative to repo root.
venv = ".venv"                     # The specific env name uv manages (uv sync creates .venv).

# --- What to analyze ---
include = ["cleaning", "data-export", "file-processing", "scheduler", "scrapper"]
exclude = [
    "**/.venv", "**/__pycache__", "build", "dist", ".git",
    ".ruff_cache", ".mypy_cache", "tests/", "**/tests/",
    "GUI/", "search-service/",
]

# --- Global strictness ---
typeCheckingMode = "standard"      # Standard typechecking mode
