trigger_scheduler:
  trigger: "0 */5 * * * ?"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_scheduler.sh"

trigger_pipeline_for_scheduled_entities:
  trigger: "0 */5 * * * ?"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_pipeline_for_scheduled_entities.sh"

trigger_zipping:
  trigger: "0 0 */1 * * ?"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_zipping.sh"
