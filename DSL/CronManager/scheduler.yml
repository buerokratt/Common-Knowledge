trigger_scheduler:
  trigger: "0 */5 * * * ?"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_scheduler_for_unscheduled_records.sh"

trigger_pipeline_for_scheduled_entities:
  trigger: "0 */5 * * * ?"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_pipeline_for_scheduled_sources.sh"

trigger_zipping:
  trigger: "0 0 */1 * * ?"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_zipping.sh"

# The content-external export is NOT a CronManager job: content-external runs
# its own hourly timer, started and stopped by the chatbot's LLM module toggle,
# which it polls (pipeline/content-export-status), so nothing fires while ON.
# CronManager cannot pause a job. See content-external/README.md, "Schedule".

# Disabled: enable by replacing "false" with "0 47 */1 * * ?".
trigger_content_drain:
  trigger: "false"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_content_drain.sh"

# Disabled: enable by replacing "false" with "0 35 3 * * ?".
trigger_content_reconcile:
  trigger: "false"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_content_reconcile.sh"

trigger_presigned_url_refresh:
  trigger: "0 30 */1 * * ?"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_presigned_url_refresh.sh"
