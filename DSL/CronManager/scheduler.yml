trigger_scheduler:
  trigger: "0 */5 * * * ?"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_scheduler_for_unscheduled_records.sh"

trigger_pipeline_for_scheduled_entities:
  trigger: "0 */5 * * * ?"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_pipeline_for_scheduled_sources.sh"

trigger_zipping:
  trigger: "0 0 */1 * * ?"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_zipping.sh"

# Disabled: CronManager registers a job whose trigger is "false" but never schedules it.
# Enable by replacing "false" with "0 17 */1 * * ?".
trigger_content_export:
  trigger: "false"
  type: exec
  command: "/bin/bash ../app/scripts/trigger_content_export.sh"
