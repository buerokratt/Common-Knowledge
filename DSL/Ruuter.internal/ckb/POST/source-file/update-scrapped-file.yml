declaration:
  call: declare
  version: 0.1
  description: "update scrapped file table"
  method: post
  accepts: json
  returns: json
  namespace: source-file
  allowlist:
    body:
      - field: base_id
        type: string
        description: "Source file ID"
      - field: url
        type: string
        description: "scrapped url"
      - field: page_title
        type: string
        description: "Title of the scraped page"
      - field: original_data_url
        type: string
        description: "scrapped data url"
      - field: original_metadata_url
        type: string
        description: "scraped data's metadata url"
      - field: original_data_hash
        type: string
        description: "hash of scrapped data"
      - field: scraped_at
        type: string
        description: "When the source was scraped"
      - field: external_id
        type: string
        description: "Optional external id"
      - field: status
        type: string
        description: "Processing status (e.g. in_review, scraping, cleaning, finished)"

updateScrappedFile:
  call: http.post
  args:
    url: "[#CKB_RESQL]/source_file/update_source_file_scraped"
    body:
      base_id: ${incoming.body.base_id}
      url: ${incoming.body.url}
      page_title: ${incoming.body.page_title}
      original_data_url: ${incoming.body.original_data_url}
      original_metadata_url: ${incoming.body.original_metadata_url}
      original_data_hash: ${incoming.body.original_data_hash}
      scraped_at: ${incoming.body.scraped_at}
      external_id: ${incoming.body.external_id}
      status: ${incoming.body.status}
  result: res

returnResult:
  return: "OK"
  next: end
