declaration:
  call: declare
  version: 0.1
  description: "delete file from s3"
  method: post
  accepts: json
  returns: json
  namespace: pipeline
  allowlist:
    body:
      - field: source_file_id
        type: string
        description: "delete file from S3"

getSourceFile:
  call: http.get
  args:
    url: "[#CKB_RESQL]/source_file/get_source_file"
    query:
      base_id: ${incoming.body.source_file_id}
  result: sourceFile

deleteFile:
  call: http.post
  args:
    url: "[#CKB_FILE_MANAGER]/delete-files"
    body:
      files:
        - s3_path: ${sourceFile.response.body[0].originalDataUrl}
  result: res

returnResult:
  return: "OK"
  next: end
