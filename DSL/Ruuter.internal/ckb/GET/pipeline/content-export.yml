declaration:
  call: declare
  version: 0.1
  description: "Trigger the content-external export"
  method: get
  accepts: json
  returns: json
  namespace: ckb
  allowlist:
    body: []

getAgency:
  call: http.get
  args:
    url: "[#CKB_RESQL]/agency/list_agencies"
    query:
      page: 1
      page_size: 1
      sorting: "name asc"
  result: agencies
  next: checkAgency

checkAgency:
  switch:
    - condition: ${agencies.response.body.length > 0}
      next: exportAgency
  next: returnEmpty

# Post only the first agency; the exporter fails loudly if A17's one-agency rule is broken.
exportAgency:
  call: http.post
  args:
    url: "[#CKB_CONTENT_EXTERNAL]/export_agency_async"
    contentType: json
    body:
      agency_base_id: ${agencies.response.body[0].baseId}
  result: exportResult
  next: returnSuccess

returnSuccess:
  return: ${exportResult.response.body}
  next: end

returnEmpty:
  return: ${agencies.response.body}
  next: end
