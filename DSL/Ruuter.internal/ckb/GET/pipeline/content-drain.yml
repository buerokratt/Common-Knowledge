declaration:
  call: declare
  version: 0.1
  description: "Trigger the content-external deferred-deletion drain"
  method: get
  accepts: json
  returns: json
  namespace: ckb
  allowlist:
    body: []

# The chatbot's LLM module toggle decides whether this runs; see the template.
# While it skips, deletion journals stay open and drain on the next allowed tick.
checkContentExportGate:
  template: "[#CKB_PROJECT_LAYER]/pipeline/content-export-gate"
  requestType: templates
  body:
    operation: "drain"
  result: gate
  next: checkGate

checkGate:
  switch:
    - condition: ${gate.run === true}
      next: getAgency
  next: logSkipped

logSkipped:
  log: "content-external drain skipped: ${gate.reason}"
  next: returnSkipped

returnSkipped:
  return: ${gate}
  next: end

getAgency:
  call: http.get
  args:
    url: "[#CKB_RESQL]/agency/list_agencies"
    query:
      page: 1
      page_size: 1
      sorting: "name asc"
  result: agencies
  next: checkAgency

checkAgency:
  switch:
    - condition: ${agencies.response.body.length > 0}
      next: drainAgency
  next: returnEmpty

# Post only the first agency; the exporter fails loudly if A17's one-agency rule is broken.
# No dry_run in the body: whether the drain deletes is DRAIN_DELETES_ENABLED's call (J2).
drainAgency:
  call: http.post
  args:
    url: "[#CKB_CONTENT_EXTERNAL]/drain_deletions"
    contentType: json
    body:
      agency_base_id: ${agencies.response.body[0].baseId}
  result: drainResult
  next: returnSuccess

returnSuccess:
  return: ${drainResult.response.body}
  next: end

returnEmpty:
  return: ${agencies.response.body}
  next: end
