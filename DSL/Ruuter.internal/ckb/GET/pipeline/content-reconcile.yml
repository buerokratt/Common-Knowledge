declaration:
  call: declare
  version: 0.1
  description: "Trigger the content-external reconcile report"
  method: get
  accepts: json
  returns: json
  namespace: ckb
  allowlist:
    body: []

# The chatbot's LLM module toggle decides whether this runs; see the template.
checkContentExportGate:
  template: "[#CKB_PROJECT_LAYER]/pipeline/content-export-gate"
  requestType: templates
  body:
    operation: "reconcile"
  result: gate
  next: checkGate

checkGate:
  switch:
    - condition: ${gate.run === true}
      next: getAgency
  next: logSkipped

logSkipped:
  log: "content-external reconcile skipped: ${gate.reason}"
  next: returnSkipped

returnSkipped:
  return: ${gate}
  next: end

getAgency:
  call: http.get
  args:
    url: "[#CKB_RESQL]/agency/list_agencies"
    query:
      page: 1
      page_size: 1
      sorting: "name asc"
  result: agencies
  next: checkAgency

checkAgency:
  switch:
    - condition: ${agencies.response.body.length > 0}
      next: reconcileAgency
  next: returnEmpty

# Post only the first agency; the exporter fails loudly if A17's one-agency rule is broken.
# Whether reconcile repairs is RECONCILE_REPAIR_ENABLED's call, never the caller's (J4).
reconcileAgency:
  call: http.post
  args:
    url: "[#CKB_CONTENT_EXTERNAL]/reconcile_async"
    contentType: json
    body:
      agency_base_id: ${agencies.response.body[0].baseId}
  result: reconcileResult
  next: returnSuccess

returnSuccess:
  return: ${reconcileResult.response.body}
  next: end

returnEmpty:
  return: ${agencies.response.body}
  next: end
