declaration:
  call: declare
  version: 0.1
  description: "run scheduler check"
  method: get
  accepts: json
  returns: json
  namespace: ckb
  allowlist:
    body: []

# it works like this:
#
# while True:
#     entity = get_one_not_scheduled_entity()
#     if entity == 'empty':
#         break
#     timestamp = schedule_entity(entity)
#     update_not_scheduled_entity(entity, timestamp)
#
# return "OK"

getNotScheduledEntity:
  maxRecursions: 999
  call: http.get
  args:
    url: "[#CKB_RESQL]/source/get_source_not_scheduled"
    contentType: json
  result: notScheduledEntity
  next: checkIfEntityFound

checkIfEntityFound:
  maxRecursions: 999
  switch:
    - condition: ${notScheduledEntity.response.body.length > 0}
      next: updateNextRenderedRun
  next: returnSuccess

updateNextRenderedRun:
  maxRecursions: 999
  template: "[#CKB_PROJECT_LAYER]/pipeline/update-next-rendered-timestamp"
  requestType: templates
  body:
    base_id: ${notScheduledEntity.response.body[0].baseId}
    cron_expression: ${notScheduledEntity.response.body[0].cronSchedule}
  result: schedulingResult
  next: getNotScheduledEntity

returnSuccess:
  return: "OK"
  next: end
