declaration:
  call: declare
  version: 0.1
  description: "Get a specific source by base ID"
  method: get
  accepts: json
  returns: json
  namespace: source
  allowlist:
    params:
      - field: baseId
        type: string
        description: "Base ID of the source to retrieve"

extractRequestData:
  assign:
    base_id: "${incoming.params.baseId}"

getSource:
  call: http.get
  args:
    url: "[#CKB_RESQL]/source/get_source"
    query:
      base_id: ${base_id}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
