declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'CHECK-USER-AUTHORITY'"
  method: post
  accepts: json
  returns: json
  namespace: service

get_tara_info:
  template: "[#CKB_PROJECT_LAYER]/tara"
  requestType: templates
  headers:
    cookie: ${incoming.headers.cookie}
  result: tara_res

# The guards map these results to statuses:
#   "false"     -> 401 (no user / empty user info: not logged in or session expired)
#   "forbidden" -> 403 (logged in, but without a required role)
#   user info   -> guard success
check_user_info:
  switch:
    - condition: ${tara_res?.authorities == null}
      next: return_no_user
  next: check_user_authority

check_user_authority:
  switch:
    - condition: ${tara_res.authorities.includes("ROLE_ADMINISTRATOR")}
      next: return_authorized
    - condition: ${tara_res.authorities.includes("ROLE_SERVICE_MANAGER")}
      next: return_authorized
  next: return_forbidden

return_no_user:
  return: "false"
  status: 200
  next: end

return_forbidden:
  return: "forbidden"
  status: 200
  next: end

return_authorized:
  return: ${tara_res}
