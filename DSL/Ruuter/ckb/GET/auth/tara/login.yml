declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'Tara-Login'"
  method: post
  accepts: json
  returns: json
  namespace: ckb-tara
  allowlist:
    header:
      - field: cookie
        type: string
        description: "Cookie field"

get_tara_user_info:
  call: http.get
  args:
   url: "[#CKB_TIM]/jwt/userinfo"
   contentType: plaintext
   headers:
    cookie: ${incoming.headers.cookie}
   plaintext: 
      "JWTTOKEN"
  result: tara_info
  next: getUser

getUser:
  call: http.post
  args:
    url: "[#CKB_RESQL_USERS]/get-user-by-id-code"
    body:
      idCode: ${tara_info.response.body.personalCode}
  result: user_info
  next: checkIfUserExists

checkIfUserExists:
  switch:
    - condition: "${user_info.response.body.length > 0}"
      next: assignUser
  next: return_not_exists

assignUser:
  assign:
    user: ${user_info.response.body[0]}
  next: get_session_length

get_session_length:
  call: http.post
  args:
    url: "[#CKB_RESQL_USERS]/get-configuration"
    body:
      key: "session_length"
  result: session_result
  next: generate_cookie

generate_cookie:
  call: http.post
  args:
    url: "[#CKB_TIM]/jwt/custom-jwt-generate"
    body:
      JWTName: "customJwtCookie"
      expirationInMinutes: ${session_result.response.body[0]?.value ?? '120'}
      content: {
        "idCode": "${user.idCode}",
        "login": "${user.idCode}",
        "displayName": "${user.displayName}",
        "firstName": "${user.firstName}",
        "lastName": "${user.lastName}",
        "authorities": "${user.authorities}",
        "authMethod": "${tara_info.response.body.authMethod}",
        "fullName": "${tara_info.response.body.fullName}"
      }
  result: cookie_result
  next: assign_cookie

assign_cookie:
  assign:
    setCookie:
      customJwtCookie: ${cookie_result.response.body.token}
      Domain: "[#DOMAIN]"
      Secure: true
      HttpOnly: true
      SameSite: "[#COOKIE_SAME_SITE]"
  next: return_value    

return_value:
  headers:
    Set-Cookie: ${setCookie}
  return: ${cookie_result.response.body.token}
  next: end 

return_not_exists:
  return: "User does not exist"
  next: end
