declaration:
  call: declare
  version: 0.1
  description: "List all api sources for a specific agency with pagination and sorting"
  method: get
  accepts: json
  returns: json
  namespace: source
  allowlist:
    params:
      - field: page
        type: number
        description: "Page number for pagination"
      - field: pageSize
        type: number
        description: "Number of items per page"
      - field: sorting
        type: string
        description: "Sorting criteria (url asc/desc, subsector asc/desc, last_scraped_at asc/desc, status asc/desc)"

extractRequestData:
  assign:
    page: "${incoming.params.page ?? 1}"
    page_size: "${incoming.params.pageSize ?? 10}"
    sorting: "${incoming.params.sorting ?? 'last_scraped_at desc'}"

getAgencySources:
  call: http.get
  args:
    url: "[#CKB_RESQL]/source/list_api_sources"
    query:
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
