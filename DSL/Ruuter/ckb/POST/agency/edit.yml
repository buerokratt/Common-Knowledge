declaration:
  call: declare
  version: 0.1
  description: "Update an existing agency"
  method: post
  accepts: json
  returns: json
  namespace: agency
  allowlist:
    body:
      - field: baseId
        type: string
        description: "Base ID of the agency to update"
      - field: name
        type: string
        description: "Updated name of the agency"
      - field: sector
        type: string
        description: "Updated sector of the agency"

extractRequestData:
  assign:
    base_id: "${incoming.body.baseId}"
    name: "${incoming.body.name}"
    sector: "${incoming.body.sector}"

checkNameExists:
  call: http.get
  args:
    url: "[#CKB_RESQL]/agency/check_name_exists"
    query:
      name: ${name}
      exclude_base_id: ${base_id}
  result: nameCheckResult
  next: validateNameUnique

validateNameUnique:
  switch:
    - condition: ${nameCheckResult.response.body[0].exists == true}
      next: returnError
  next: updateAgency

returnError:
  return: "Agency with this name already exists"
  status: 400
  next: end

updateAgency:
  call: http.post
  args:
    url: "[#CKB_RESQL]/agency/update_agency"
    headers:
      type: json
    body:
      base_id: ${base_id}
      name: ${name}
      sector: ${sector}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
