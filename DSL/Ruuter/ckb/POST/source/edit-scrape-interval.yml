declaration:
  call: declare
  version: 0.1
  description: "Update scrape interval settings of an existing source"
  method: post
  accepts: json
  returns: json
  namespace: source
  allowlist:
    body:
      - field: baseId
        type: string
        description: "Base ID of the source to update"
      - field: cronSchedule
        type: string
        description: "Cron schedule for scraping"
      - field: updateAutomatically
        type: boolean
        description: "Whether to update automatically"
      - field: qualityControl
        type: string
        description: "Quality control method (basic, comprehensive, or null)"
      - field: extractImages
        type: boolean
        description: "Whether to extract images during cleaning"
        required: false

extractRequestData:
  assign:
    base_id: "${incoming.body.baseId}"
    cron_schedule: "${incoming.body.cronSchedule}"
    updateAutomatically: "${incoming.body.updateAutomatically}"
    qualityControl: "${incoming.body.qualityControl != null && incoming.body.qualityControl != '' ? incoming.body.qualityControl : ''}"
    extractImages: "${incoming.body.extractImages == true}"

updateSourceScrapeInterval:
  call: http.post
  args:
    url: "[#CKB_RESQL]/source/update_source_scrape_interval"
    headers:
      type: json
    body:
      base_id: ${base_id}
      cron_schedule: ${cron_schedule}
      updateAutomatically: ${updateAutomatically}
      qualityControl: ${qualityControl}
      extractImages: ${extractImages}
  result: res

triggerScheduler:
  call: http.get
  args:
    url: "[#CKB_RUUTER_INTERNAL]/pipeline/scheduler-check-for-unscheduled-records"

  result: scheduler

returnSuccess:
  return: ${res.response.body}
  next: end
