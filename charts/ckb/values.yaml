      value: "pyamqp://admin:admin@rabbit-scrapper/scrapper"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []
  dependsOn:
    rabbitmq: true

scrapperCelery:
  enabled: true
  nameOverride: scrapper-celery
  image: 
    repository: ghcr.io/buerokratt/common-knowledge
    tag: scrapper-server-dev-1-1-1
    pullPolicy: IfNotPresent
  # Endpoints come from constants.ini (scrapper-configmap.yaml)
  env:
    - name: BROKER_URL
      value: "pyamqp://admin:admin@rabbit-scrapper/scrapper"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []

# --- Cleaning Server -----------------------------------------------------------
cleaningServer:
  enabled: true
  nameOverride: cleaning-server
  image:
    repository: ghcr.io/varmoh/common-knowledge
    tag: cleaning-server-dev-1-1-2
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8123
  # Endpoints come from constants.ini (cleaning-server-configmap.yaml)
  env: []
  volumes:
    enabled: true
  extraVolumes: []
  extraVolumeMounts: []

# --- Content External ----------------------------------------------------------
contentExternal:
  enabled: true
  nameOverride: content-external
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: content-external-dev-1-1-1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8125
  # Guarded by ckb.contentExternal.workDir in templates/_helpers.tpl: a value
  # inside a scrapped-data tree aborts the render (rule 1).
  workDir: /var/lib/content-external
  # CONTENT_WORK_DIR is NOT listed here — the deployment templates it from
  # workDir above so the env var and the volume mount cannot drift.
  #
  # The destination is a DEPLOYMENT choice, set explicitly rather than left to
  # the code default so `helm template` answers "which sink is this running?"
  # without anyone reading Python. Every invalid combination below is refused
  # at startup by name, never at first commit.
  #
  # MANIFEST_STORE_* is deliberately absent for object_store: an empty
  # MANIFEST_STORE_BACKEND means the manifest lives in the sink's own store,
  # bucket AND prefix, inherited wholesale, so this deployment shape gains no
  # configuration at all. An llm_module deployment MUST set it — an HTTP API
  # has nowhere to hold a manifest — along with LLM_MODULE_BASE_URL (https://
  # only; the body is Estonian government document text),
  # LLM_MODULE_COLLECTION and LLM_MODULE_VAULT_SECRET_PATH.
  # LLM_MODULE_COLLECTION (L19) names the NEW physical collection the cutover
  # bootstraps beside the live one — never the retrieval alias (the swap and
  # its rollback move the alias), and never contextual_chunks_*, which startup
  # refuses; list the alias itself in LLM_MODULE_PROTECTED_COLLECTIONS
  # (comma-separated) so startup refuses that too. GET /health's sink_id shows
  # which collection a pod writes to. The collection is part of the
  # manifest's sink_id, so changing it against an existing manifest fails the
  # run: a re-bootstrap into another collection also takes a fresh
  # MANIFEST_STORE_PREFIX.
  #
  # An s3 manifest store authenticates with the EXTERNAL_S3_* keys from
  # contentExternal.externalStore.secret, and startup refuses it without them.
  #
  # MANIFEST_STORE_BACKEND=local is development only and additionally needs
  # MANIFEST_STORE_ALLOW_LOCAL=true. Never set it in a chart values file: a
  # re-provisioned PVC would read as a first run, republishing the corpus and
  # permanently orphaning every document CKB deleted while it was gone.
  #
  # CHUNK_PROFILE is pinned per deployment alongside the sink, because whoever
  # embeds the chunks decides what fits. It must name a preset in
  # content-external/exporter/core/constants.py CHUNK_PROFILES. There is
  # deliberately no _helpers.tpl check: a copy of the preset list here would
  # drift, and startup already refuses an unknown name. An llm_module
  # deployment MUST choose it from that embedder's token budget (the
  # contract's §13 q1) and then name it again in
  # LLM_MODULE_CHUNK_PROFILE_CONFIRMED: the value below is set for every
  # deployment, so on its own it shows no choice was made, and startup refuses
  # llm_module until the two match. Never give the confirmation a default
  # here. Changing CHUNK_PROFILE re-chunks the whole corpus on the next run (on
  # llm_module, re-embeds it, and the run is refused until an operator passes
  # --accept-rechunk — L18).
  #
  # LLM_MODULE_ENABLE_METADATA_MERGE (L25) is off by default even though the
  # contract agrees the merge: a far side that answered a merge without
  # applying it would leave stale metadata nobody retries. Set "true" only
  # once the llm-module is confirmed to apply it all-or-nothing; until then a
  # metadata change re-pushes (and re-embeds) the whole document.
  #
  # The ingest contract is AGREED (content-external/docs/
  # llm-module-ingest-contract.md; recorded 2026-10-28 on an assumption,
  # written sign-off pending), so llm_module needs no development flag; it
  # would be refused again only if that agreement were withdrawn. Its credential is
  # read from Vault per task (L11) through VAULT_ADDR + VAULT_TOKEN_PATH, a
  # token Vault Agent keeps fresh. Two ways to provide that agent:
  #
  #   1. The chart's own sidecar — `vaultAgent.enabled: true` below. The
  #      cluster counterpart of compose's vault-agent-content. It sets
  #      VAULT_ADDR and VAULT_TOKEN_PATH itself; do not also set them in env.
  #   2. The Vault Agent Injector, if the cluster runs one — leave vaultAgent
  #      disabled and annotate instead:
  #
  #        podAnnotations:
  #          vault.hashicorp.com/agent-inject: "true"
  #          vault.hashicorp.com/role: "content-external"
  #          vault.hashicorp.com/agent-inject-token: "true"   # -> /vault/secrets/token
  #
  #      with VAULT_ADDR and VAULT_TOKEN_PATH=/vault/secrets/token in env.
  #
  # Rendering refuses both at once. It recognises the injector only by the
  # `vault.hashicorp.com/agent-inject` annotation in podAnnotations; an
  # injector enabled any other way (a namespace-wide mutating webhook rule,
  # annotations added by another controller) is not seen, so do not combine
  # the two. For an llm_module deployment, in env:
  #
  #   - name: CONTENT_SINK                  value: "llm_module"
  #   - name: LLM_MODULE_BASE_URL           value: "https://..."
  #   - name: LLM_MODULE_COLLECTION         value: "ckb_chunks_v1"
  #   - name: LLM_MODULE_PROTECTED_COLLECTIONS  value: "ckb_retrieval"
  #   - name: LLM_MODULE_VAULT_SECRET_PATH  value: "content-external/llm_module"
  #   - name: CHUNK_PROFILE                 value: "<from §13 q1>"
  #   - name: LLM_MODULE_CHUNK_PROFILE_CONFIRMED  value: "<the same name>"
  #   (+ VAULT_ADDR / VAULT_TOKEN_PATH only for option 2)
  #
  # The service never caches the credential, so the agent's renewal is
  # picked up without a restart.
  #
  # STALE_SWEEP_ENABLED (L10) is off by default; "true" lets a committed run
  # that saw the whole corpus ask the destination to drop what the manifest
  # no longer accounts for. The object-store sink reports not_supported.
  env:
    - name: CONTENT_SINK
      value: "object_store"
    - name: CHUNK_PROFILE
      value: "azure_native"
  # L11's credential path for an llm_module deployment — see the comment
  # above. Empty for object_store, which needs no Vault.
  podAnnotations: {}
  extraVolumes: []
  extraVolumeMounts: []
  # The pod's identity. The sidecar's kubernetes auth binds a Vault role to
  # it, and rendering refuses kubernetes auth without one: binding the role
  # to `default` would hand the llm-module credential to every pod in the
  # namespace running as `default`.
  serviceAccount:
    create: false
    name: ""        # empty + create: true -> contentExternal.nameOverride
  # Pod-level securityContext. With vaultAgent enabled and either container
  # running as non-root, set fsGroup too: the sidecar writes the token 0640
  # and the approle Secret is mounted 0440, so without a shared group the
  # exporter cannot read the token (every llm-module run then fails with
  # `credential unavailable`) and a non-root agent cannot read its role_id.
  podSecurityContext: {}
  # L11: the built-in Vault Agent sidecar (option 1 above). Off by default;
  # an object_store deployment needs no Vault at all.
  #
  # It keeps a token at <tokenMountPath>/token in a memory-backed emptyDir,
  # renewed and re-authenticated by the agent, and the chart points
  # VAULT_ADDR / VAULT_TOKEN_PATH at it. The exporter reads it on every
  # llm-module operation and never at startup, so a Vault outage is a
  # `failed` run with `credential unavailable`, never a pod that will not
  # start — and the sidecar has no readiness probe, so it never takes /health
  # off the Service either.
  #
  # auth.method:
  #   kubernetes (default, recommended) — the pod's service-account token;
  #     nothing to rotate. Vault-side, once, with the content-external-policy
  #     vault/init.sh already defines:
  #       vault auth enable kubernetes
  #       vault write auth/kubernetes/config \
  #           kubernetes_host="https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT"
  #       vault write auth/kubernetes/role/content-external-service \
  #           bound_service_account_names=<serviceAccount name> \
  #           bound_service_account_namespaces=<namespace> \
  #           token_policies=content-external-policy token_ttl=1h token_max_ttl=4h
  #   approle — compose's method. auth.approleSecret names a Secret holding
  #     the role_id and secret_id. vault/init.sh gives secret_id a 24h TTL,
  #     so something must rotate that Secret, or re-authentication fails a
  #     day after it was minted.
  vaultAgent:
    enabled: false
    image:
      repository: hashicorp/vault
      tag: "1.21.3"     # the version compose's agents run
      pullPolicy: IfNotPresent
    vaultAddr: "http://vault:8200"
    # Where the exporter container sees the token directory, read-only.
    tokenMountPath: /vault/agent
    auth:
      method: kubernetes
      mountPath: ""     # default: auth/kubernetes or auth/approle
      role: content-external-service   # kubernetes only
      approleSecret:                   # approle only
        name: ""
        roleIdKey: role_id
        secretIdKey: secret_id
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "32Mi"
  # The object-store sink's destination (D6/D7): any S3-compatible endpoint,
  # chosen by URL alone. A DIFFERENT bucket and DIFFERENT credentials from
  # CKB's own — never CKB's read-only AWS_* keys. Left blank, the service still
  # starts and serves /health; a run refuses, naming every missing variable.
  externalStore:
    endpointUrl: ""
    bucket: ""
    region: "us-east-1"
    # D11. Set false for a store whose DeleteObjects is missing or partial;
    # deletes then go one key at a time with an identical outcome.
    supportsBatchDelete: true
    # The credentials come from a Secret, never from values. Empty name = not
    # wired (the env vars are simply absent).
    secret:
      name: ""
      accessKeyIdKey: access_key_id
      secretAccessKeyKey: secret_access_key
  # CKB's own bucket, separate from externalStore. The Secret must grant only
  # s3:GetObject; reusing file-processing's keys is for local development only.
  # Empty credentials are allowed until the first document read.
  sourceBucket:
    endpointUrl: ""
    bucket: ""
    region: "us-east-1"
    secret:
      name: ""
      accessKeyIdKey: access_key_id
      secretAccessKeyKey: secret_access_key
  # A16. Peak memory is a PRODUCT, and both of its factors are configured
  # elsewhere:
  #
  #   limits.memory >= EXPORT_CONCURRENCY x MAX_DOCUMENT_BYTES x 3 + ~192Mi
  #
  # The x3 is because a document is held as bytes, as a decoded NFC-normalised
  # string, and as its chunks, all at once — the chunker needs the whole
  # string in memory. At the defaults (4 x 20MB) that is ~432Mi; at the
  # documented concurrency cap of 16 it is ~1.2Gi, before JSON encoding
  # inflates an llm-module request body.
  #
  # RAISING EXPORT_CONCURRENCY MEANS RAISING THIS. The service computes the
  # product at startup, compares it against the container's own limit, and
  # REFUSES TO START if it does not fit — because an OOMKill on an
  # incremental run never converges: manifest checkpointing is first-run-only
  # by design, so the run would die at the same document every hour,
  # committing nothing, forever.
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  persistence:
    size: 1Gi
    # A14. MUST be ReadWriteOnce, and ckb.contentExternal.accessMode in
    # templates/_helpers.tpl fails the render on anything else. F2's run lock
    # is an flock, which is only sound within one kernel: on a ReadWriteMany
    # volume (NFS/EFS/CephFS) it is advisory and routinely not honoured
    # across nodes, so an export and a drain would run concurrently with no
    # error at all. The StorageClass backing this must be block or local.
    #
    # The other two A14 facts live in content-external-deployment.yaml:
    # replicas: 1, and strategy: Recreate (never RollingUpdate, whose whole
    # behaviour is to run two pods at once).
    accessMode: ReadWriteOnce

# --- RabbitMQ (scrapper) -------------------------------------------------------
rabbitmq:
  enabled: true
  nameOverride: rabbit-scrapper
  image:
    repository: rabbitmq
    tag: 4-management
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    amqpPort: 5672
    uiPort: 15672
  env:
    - name: RABBITMQ_DEFAULT_USER
      value: "admin"
    - name: RABBITMQ_DEFAULT_PASS
      value: "admin"
    - name: RABBITMQ_DEFAULT_VHOST
      value: "scrapper"

# --- Scheduler -----------------------------------------------------------------
scheduler:
  enabled: true
  nameOverride: scheduler
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: scheduler-dev-1-1-1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8124


