# Global settings applied across templates
global:
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  labels: {}
  annotations: {}
  domain: example.com
  tim_postgresql:
    auth:
      username: tim
serviceAccount:
  create: true
  name: ""
  annotations: {}

# --- Database (PostgreSQL) -----------------------------------------------------
database:
  enabled: true
  nameOverride: database
  image:
    repository: postgres
    tag: "14.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    annotations: {}
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""
  env:
    - name: POSTGRES_USER
      value: "byk"
    - name: POSTGRES_DB
      value: "ckb_db"
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
  secret:
    create: true
    name: database-secret
    keys:
      POSTGRES_PASSWORD: "01234"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Liquibase --------------------------------------------------------
liquibase:
  enabled: true
  backoffLimit: 3
  image:
    repository: liquibase/liquibase
    tag: "latest"
    pullPolicy: IfNotPresent
  repo: "https://github.com/varmoh/Common-Knowledge.git"
  branch: "dev"
  path: "DSL/Liquibase"
  env:
    - name: POSTGRES_USER
      value: "byk"
    - name: LIQUIBASE_URL
      value: "jdbc:postgresql://ckb-database:5432/ckb_db"

# --- File Processing API --------------------------------------------------------
fileProcessing:
  enabled: true
  nameOverride: file-processing-api
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: file-processing-dev-1-1-1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8888
  ingress:
    enabled: false
    className: ""
    hosts: []
    tls: []
  env:
    - name: AWS_ACCESS_KEY_ID
      value: ""
    - name: AWS_SECRET_ACCESS_KEY
      value: ""
    - name: AWS_REGION
      value: "us-east-1"
    - name: S3_ENDPOINT_URL
      value: ""
    - name: S3_BUCKET_NAME
      value: ""
    - name: SOURCE_PATH
      value: "/app/data"
    - name: S3_PRESIGNED_URL_EXPIRATION
      value: "3600"
    - name: S3_UPLOAD_URL_EXPIRATION
      value: "3600"
    - name: AUTO_CLEANUP_COMPLETED_TASKS
      value: "true"
    - name: COMPLETED_TASK_CLEANUP_DELAY_MINUTES
      value: "5"
    - name: PERIODIC_CLEANUP_INTERVAL_MINUTES
      value: "60"
    - name: MAX_TASK_AGE_HOURS
      value: "24"
  probes:
    path: /docs
    initialDelaySeconds: 40
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  persistence:
    enabled: true
    size: 1Gi
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# --- ReSQL (ckb) ---------------------------------------------------------------
resqlCkb:
  enabled: true
  nameOverride: resql-ckb
  image:
    repository: ghcr.io/buerokratt/resql
    tag: v1.3.4
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
  env:
    - name: server.port
      value: "8090"
    - name: SQLMS_DATASOURCES_0_NAME
      value: "byk"
    - name: SQLMS_DATASOURCES_0_JDBCURL
      value: "jdbc:postgresql://database:5432/ckb_db"
    - name: SQLMS_DATASOURCES_0_USERNAME
      value: "byk"
    - name: SQLMS_DATASOURCES_0_PASSWORD
      value: "01234"
    - name: LOGGING_LEVEL_ROOT
      value: "INFO"
  volumes:
    enabled: true
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  extraVolumes: []
  extraVolumeMounts: []

# --- Ruuter (public) -----------------------------------------------------------
ruuter:
  enabled: true
  ingress:
    enabled: false
    host: ruuter.example.com
    annotations:
      kubernetes.io/ingress.class: "nginx"
      cert-manager.io/cluster-issuer: "letsencrypt"
    tlsSecret: ruuter-tls
  nameOverride: ruuter
  image:
    repository: ghcr.io/buerokratt/ruuter
    tag: v2.2.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8086
  env:
    - name: application.cors.allowedOrigins
      value: "http://localhost:8086,http://localhost:3001,http://localhost:3003,http://localhost:8080"
    - name: application.httpCodesAllowList
      value: "200,201,202,400,401,403,500"
    - name: application.internalRequests.allowedIPs
      value: "127.0.0.1"
    - name: application.logging.displayRequestContent
      value: "true"
    - name: application.logging.displayResponseContent
      value: "true"
    - name: application.logging.printStackTrace
      value: "true"
    - name: application.internalRequests.disabled
      value: "true"
    - name: server.port
      value: "8086"
    - name: application.externalAuthAllowed
      value: ""
  config:
    constantsIni: |-
      configmap somehow
  volumes:
    mountConstantsIni: true
    mountDSL: false
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# --- Ruuter (internal) ---------------------------------------------------------
ruuterInternal:
  enabled: true
  ingress:
    enabled: false
    host: ruuter.example.com
    annotations:
      kubernetes.io/ingress.class: "nginx"
      cert-manager.io/cluster-issuer: "letsencrypt"
    tlsSecret: ruuter-tls
  nameOverride: ruuter-internal
  image:
    repository: ghcr.io/buerokratt/ruuter
    tag: v2.2.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8089
  env:
    - name: application.cors.allowedOrigins
      value: "http://localhost:8086,http://localhost:8089,http://localhost:3001,http://localhost:3003,http://localhost:8080"
    - name: application.httpCodesAllowList
      value: "200,201,202,400,401,403,500"
    - name: application.internalRequests.allowedIPs
      value: "127.0.0.1"
    - name: application.logging.displayRequestContent
      value: "true"
    - name: application.logging.displayResponseContent
      value: "true"
    - name: application.logging.printStackTrace
      value: "true"
    - name: application.internalRequests.disabled
      value: "true"
    - name: server.port
      value: "8089"
  config:
    constantsIni: |-
      configmap somehow
  volumes:
    mountConstantsIni: true
    mountDSL: false
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# --- Data Mapper ---------------------------------------------------------------
dataMapper:
  enabled: true
  nameOverride: data-mapper
  image: 
    repository: ghcr.io/buerokratt/datamapper
    tag: v2.2.9
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3005
  env:
    - name: PORT
      value: "3005"
    - name: CONTENT_FOLDER
      value: "/data"
  volumes:
    enabled: true
  extraVolumes:
    - name: dsl
      emptyDir: {}
  extraVolumeMounts:
    - name: dsl
      mountPath: /DSL

# --- Data Export ---------------------------------------------------------------
dataExport:
  enabled: true
  nameOverride: data-export
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: data-export-dev-1-1-1
    pullPolicy: IfNotPresent
  command: ["python", "debug.py"]
  service:
    type: ClusterIP
    port: 8889
    targetPort: 8888
  env:
    - name: DB_URI
      value: "postgresql://byk:CHANGEME@database:5432/services_db"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []

# --- GUI (React) ---------------------------------------------------------------
gui:
  enabled: true
  nameOverride: gui
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: GUI-dev-1-1-1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
  env:
    - name: NODE_ENV
      value: development
    - name: BASE_URL
      value: http://localhost:8080/ckb
    - name: REACT_APP_RUUTER_API_URL
      value: http://localhost:8086/ckb
    - name: REACT_APP_CSP
      value: "upgrade-insecure-requests; default-src 'self'; font-src 'self' data:; img-src * data:; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; connect-src 'self' http://localhost:8086 http://localhost:8085 http://localhost:4040 https://admin.dev.buerokratt.ee/chat/menu.json https://*.s3.amazonaws.com;"
    - name: DEBUG_ENABLED
      value: "true"
    - name: CHOKIDAR_USEPOLLING
      value: "true"
    - name: PORT
      value: "3001"
    - name: REACT_APP_CKB_BASE_URL
      value: http://localhost:8080/ckb
    - name: REACT_APP_SERVICE_ID
      value: ckb
    - name: REACT_APP_ENABLE_HIDDEN_FEATURES
      value: "true"
    - name: REACT_APP_VALIDATIONS_ENABLED
      value: "FALSE"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  ingress:
    enabled: false
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: gui.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

# --- Cron Manager --------------------------------------------------------------
cronManager:
  enabled: true
  nameOverride: cron-manager
  image:
    repository: ghcr.io/buerokratt/cronmanager
    tag: v1.1.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9010
  env:
    - name: SERVER_PORT
      value: "9010"
  volumes:
    enabled: true

# --- OpenSearch ----------------------------------------------------------------
opensearch:
  enabled: true
  nameOverride: opensearch-node
  image:
    repository: opensearchproject/opensearch
    tag: "2.11.1"
    pullPolicy: IfNotPresent
  service:
    annotations: {}
    node:
      type: ClusterIP
      ports:
        rest: 9200
        metrics: 9600
  env:
    - name: node.name
      value: "opensearch-node"
    - name: discovery.type
      value: "single-node"
    - name: bootstrap.memory_lock
      value: "true"
    - name: OPENSEARCH_JAVA_OPTS
      value: "-Xms1g -Xmx1g"
    - name: plugins.security.disabled
      value: "true"
    - name: node.max_local_storage_nodes
      value: '2'
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""
  resources: {}

# --- Search Service ------------------------------------------------------------
searchService:
  enabled: true
  nameOverride: search-service
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: search-service-dev-1-1-1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    externalPort: 3009
  env:
    - name: OPENSEARCH_URL
      value: "http://opensearch-node:9200"
    - name: DATA_PATH
      value: "/app/data"
    - name: PORT
      value: "3000"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []
  restartPolicy: Always

# --- TIM ----------------------------------------------------------------------
tim:
  enabled: true
  nameOverride: tim
  ingress:
    enabled: false
    host: tim.example.com
    secretName: tim-tls
  image:
    repository: ghcr.io/buerokratt/tim
    tag: pre-apha-2.7.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8085
  env:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: tim-postgres-secret
          key: POSTGRES_PASSWORD
  config:
    security_allowlist_jwt: "ruuter,ruuter-internal,data-mapper,resql,tim,tim-postgresql,chat-widget,127.0.0.1,::1"
    jwt_keystore_password: "defaultpassword"
    jwt_issuer: "tim-issuer"
    spring_profiles_active: "dev"
    logging_level_root: "DEBUG"
    legacy_cookie_name: "PHPSESSID"
    legacy_cookie_domain: "example.com"
    legacy_referer_marker: "NA"
    legacy_url: "NA"
    oauth2_client_id: "your-client-id"
    oauth2_client_secret: "my-secret-value"
    oauth2_client_scope: "read,write"
    oauth2_user_auth_uri: "https://tara-test.ria.ee/oidc/authorize"
    oauth2_access_token_uri: "https://tara-test.ria.ee/oidc/token"
    oauth2_jwk_uri: "https://tara-test.ria.ee/oidc/jwks"
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"

# --- TIM PostgreSQL ------------------------------------------------------------
timPostgresql:
  enabled: true
  nameOverride: tim-postgresql
  image:
    repository: postgres
    tag: "14.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    externalPort: 9876
  env:
    - name: POSTGRES_USER
      value: "tim"
    - name: POSTGRES_DB
      value: "tim"
    - name: POSTGRES_HOST_AUTH_METHOD
      value: "trust"
  secret:
    create: true
    name: tim-postgres-secret
    keys:
      POSTGRES_PASSWORD: "Ab123"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""

