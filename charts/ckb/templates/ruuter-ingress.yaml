{{- if .Values.ruuter.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ruuter
  annotations:
    {{- range $key, $value := .Values.ruuter.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: "nginx"
  rules:
    - host: {{ .Values.ruuter.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-ruuter
                port:
                  number: {{ .Values.ruuter.service.port }}
  tls:
    - hosts:
        - {{ .Values.ruuter.ingress.host }}
      secretName: {{ .Values.ruuter.ingress.tlsSecret }}
{{- end }}
