{{- if .Values.gui.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.gui.nameOverride | default "gui" }}
  annotations:
{{- range $key, $value := .Values.gui.ingress.annotations }}
    {{ $key }}: {{ $value }}
{{- end }}
spec:
  rules:
{{- range .Values.gui.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
{{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Values.gui.nameOverride | default "gui" }}
                port:
                  number: {{ $.Values.gui.service.port }}
{{- end }}
{{- end }}
  {{- if .Values.gui.ingress.tls }}
  tls:
{{- range .Values.gui.ingress.tls }}
    - hosts:
{{- range .hosts }}
        - {{ . }}
{{- end }}
      secretName: {{ .secretName }}
{{- end }}
  {{- end }}
{{- end }}
