{{- if and .Values.contentExternal.enabled .Values.contentExternal.serviceAccount.create }}
# Its own identity, so a Vault kubernetes-auth role can be bound to
# content-external alone (L11) rather than to the namespace's `default`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ckb.contentExternal.serviceAccountName" . }}
  labels:
    app: {{ .Values.contentExternal.nameOverride }}
automountServiceAccountToken: true
{{- end }}
