{{- if .Values.contentExternal.enabled }}
{{- $va := .Values.contentExternal.vaultAgent }}
{{- $vaultMethod := "" }}
{{- if $va.enabled }}
{{- $vaultMethod = include "ckb.contentExternal.vaultAgentMethod" . }}
{{- end }}
{{- $serviceAccount := include "ckb.contentExternal.serviceAccountName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.contentExternal.nameOverride }}
  labels:
    app: {{ .Values.contentExternal.nameOverride }}
spec:
  # A14: F2's flock is the only defence against an export and a drain
  # overlapping, and flock is only sound within one kernel. replicas must
  # stay 1 — never scale this deployment.
  replicas: 1
  strategy:
    # A14: never RollingUpdate. It runs two pods at once, which on an RWX
    # volume (flock advisory, not honoured across nodes) means two
    # concurrent exports with no error, and on RWO means a stalled rollout.
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.contentExternal.nameOverride }}
  template:
    metadata:
      labels:
        app: {{ .Values.contentExternal.nameOverride }}
      # L11: how a cluster hands the llm-module sink its Vault token — the
      # built-in sidecar (vaultAgent), or the Vault Agent Injector's
      # annotations. See values.yaml.
      {{- if or .Values.contentExternal.podAnnotations $va.enabled }}
      annotations:
        {{- with .Values.contentExternal.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $va.enabled }}
        # A changed agent config restarts the pod; nothing else would.
        checksum/vault-agent: {{ include (print $.Template.BasePath "/content-external-vault-agent-configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- if $serviceAccount }}
      serviceAccountName: {{ $serviceAccount }}
      {{- end }}
      {{- with .Values.contentExternal.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.contentExternal.nameOverride }}
          image: "{{ .Values.contentExternal.image.repository }}:{{ .Values.contentExternal.image.tag }}"
          imagePullPolicy: {{ .Values.contentExternal.image.pullPolicy }}
          env:
            # CONTENT_WORK_DIR and the volumeMount below are templated from
            # the same guarded value on purpose. If they drift, the run lock
            # and the deletion journal land on the pod's ephemeral filesystem
            # and nothing reports it until a restart. The service requires
            # this variable and refuses to start without it.
            - name: CONTENT_WORK_DIR
              value: {{ include "ckb.contentExternal.workDir" . | quote }}
            {{- range .Values.contentExternal.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- if $va.enabled }}
            # L11: the token the sidecar below keeps fresh, read on every
            # llm-module operation. Templated from the same value as the
            # mount, so the two cannot drift; vaultAgentMethod refuses a
            # second definition in env.
            - name: VAULT_ADDR
              value: {{ $va.vaultAddr | quote }}
            - name: VAULT_TOKEN_PATH
              value: {{ printf "%s/token" (trimSuffix "/" $va.tokenMountPath) | quote }}
            {{- end }}
            # The external destination: a different bucket and different
            # credentials from CKB's own (rule 6). The keys come from a Secret.
            {{- with .Values.contentExternal.externalStore }}
            - name: EXTERNAL_S3_ENDPOINT_URL
              value: {{ .endpointUrl | quote }}
            - name: EXTERNAL_S3_BUCKET_NAME
              value: {{ .bucket | quote }}
            - name: EXTERNAL_S3_REGION
              value: {{ .region | quote }}
            - name: EXTERNAL_S3_SUPPORTS_BATCH_DELETE
              value: {{ .supportsBatchDelete | quote }}
            {{- if .secret.name }}
            - name: EXTERNAL_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .secret.name | quote }}
                  key: {{ .secret.accessKeyIdKey | quote }}
            - name: EXTERNAL_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secret.name | quote }}
                  key: {{ .secret.secretAccessKeyKey | quote }}
            {{- end }}
            {{- end }}
            # CKB's own bucket uses a separate read-only s3:GetObject key.
            {{- with .Values.contentExternal.sourceBucket }}
            - name: S3_ENDPOINT_URL
              value: {{ .endpointUrl | quote }}
            - name: S3_BUCKET_NAME
              value: {{ .bucket | quote }}
            - name: AWS_REGION
              value: {{ .region | quote }}
            {{- if .secret.name }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .secret.name | quote }}
                  key: {{ .secret.accessKeyIdKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secret.name | quote }}
                  key: {{ .secret.secretAccessKeyKey | quote }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.contentExternal.service.port }}
          # A16: limits.memory is sized from EXPORT_CONCURRENCY x
          # MAX_DOCUMENT_BYTES x 3 plus overhead — see the comment on this
          # block in values.yaml. The service asserts that product against
          # the container's own limit at startup and refuses to start if it
          # does not fit, so a concurrency raised without raising the limit
          # is a crashed container rather than an hourly OOMKill that never
          # converges.
          resources:
            {{- toYaml .Values.contentExternal.resources | nindent 12 }}
          # Safe with replicas: 1 + strategy: Recreate — there is no rolling
          # update for readiness to stall. /health is a sync handler, so a
          # long-running export cannot starve it, and it stays 200 even after
          # a failed run: restarting the pod does not fix a wrong URL or a
          # rotated credential, and the CrashLoopBackOff would hide the log
          # line that says why. A startup refusal (bad config, or A14's flock
          # self-test) leaves no listener at all, which these do surface.
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.contentExternal.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.contentExternal.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: content-external-work
              mountPath: {{ include "ckb.contentExternal.workDir" . }}
            {{- if $va.enabled }}
            - name: vault-agent-token
              mountPath: {{ trimSuffix "/" $va.tokenMountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.contentExternal.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if $va.enabled }}
        # L11: compose's vault-agent-content, as a sidecar. It writes and
        # renews the token; it serves nothing, so it needs no port. The
        # exporter does not read Vault at startup, so the two start in any
        # order: until the first token lands, an llm-module push fails as
        # `credential unavailable` and the next tick retries.
        - name: vault-agent
          image: "{{ $va.image.repository }}:{{ $va.image.tag }}"
          imagePullPolicy: {{ $va.image.pullPolicy }}
          command: ["vault", "agent", "-config=/vault/config/agent.hcl", "-log-level=info"]
          env:
            - name: VAULT_ADDR
              value: {{ $va.vaultAddr | quote }}
          resources:
            {{- toYaml $va.resources | nindent 12 }}
          # Deliberately no readiness probe. A pod is Ready only when every
          # container is, so a token-file probe would turn a Vault outage
          # into content-external dropping off its Service — /health and the
          # export endpoint gone — when the design is for it to surface as a
          # `failed` run with `credential unavailable` and keep serving.
          volumeMounts:
            - name: vault-agent-token
              mountPath: /agent/out
            - name: vault-agent-config
              mountPath: /vault/config
              readOnly: true
            {{- if eq $vaultMethod "approle" }}
            - name: vault-agent-approle
              mountPath: /agent/credentials
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: content-external-work
          persistentVolumeClaim:
            claimName: "{{ .Values.contentExternal.nameOverride }}-work-pvc"
        {{- if $va.enabled }}
        # Memory-backed: the token never touches a node's disk. Memory
        # counts against the pod's limit, so it is capped: a token is bytes.
        - name: vault-agent-token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: vault-agent-config
          configMap:
            name: {{ .Values.contentExternal.nameOverride }}-vault-agent
        {{- if eq $vaultMethod "approle" }}
        - name: vault-agent-approle
          secret:
            secretName: {{ $va.auth.approleSecret.name | quote }}
            # Group-readable, so a podSecurityContext.fsGroup lets a
            # non-root agent read it.
            defaultMode: 0440
            items:
              - key: {{ $va.auth.approleSecret.roleIdKey | quote }}
                path: role_id
              - key: {{ $va.auth.approleSecret.secretIdKey | quote }}
                path: secret_id
        {{- end }}
        {{- end }}
        {{- with .Values.contentExternal.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
