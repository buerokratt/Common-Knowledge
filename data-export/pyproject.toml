[project]
name = "data-export"
version = "0.1.0"
requires-python = "==3.12.10"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "psycopg2-binary==2.9.10",
    "pydantic-settings==2.9.1",
]

[dependency-groups]
dev = [
    "ruff==0.8.6",
    "pyright==1.1.391",
    "pre-commit==4.1.0",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4
target-version = "py312"
fix = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "T20", "N", "ANN", "ERA", "PERF"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pyright]
pythonVersion = "3.12.10"
venvPath = "."
venv = ".venv"
include = ["*"]
exclude = [
    "**/.venv", "**/__pycache__", "build", "dist", ".git",
    ".ruff_cache", ".mypy_cache", "tests/", "**/tests/",
]
typeCheckingMode = "standard"
