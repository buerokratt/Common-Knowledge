services:

  vault:
    image: hashicorp/vault:1.21.3
    container_name: vault
    restart: unless-stopped
    command: ["vault", "server", "-config=/vault/config/config.hcl"]
    networks:
      - bykstack
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_SKIP_VERIFY_CONFIG_PERMISSIONS: "true"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/file
      - vault-logs:/vault/logs
      - ./vault/config/config.hcl:/vault/config/config.hcl:ro
    expose:
      - "8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ─────────────────────────────────────────────
  # VAULT INIT — runs once, then exits
  # ─────────────────────────────────────────────
  vault-init:
    image: hashicorp/vault:1.21.3
    container_name: vault-init
    user: "0"
    networks:
      - bykstack
    volumes:
      # vault-init-data is a SEPARATE volume from vault-data so that unseal
      # keys and the init flag are not written into Vault's storage directory.
      - vault-init-data:/vault/data
      - vault-agent-creds:/agent/credentials
      - vault-agent-token:/agent/out
      - ./vault/init.sh:/vault/init.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq >/dev/null 2>&1 &&
        chmod -R 755 /agent/credentials &&
        chmod -R 770 /agent/out &&
        chown -R vault:vault /agent/credentials /agent/out &&
        su vault -s /bin/sh /vault/init.sh
    environment:
      VAULT_ADDR: "http://vault:8200"
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"

  # ─────────────────────────────────────────────
  # VAULT AGENT — proxy for cleaning-server
  # ─────────────────────────────────────────────
  vault-agent-cleaner:
    image: hashicorp/vault:1.21.3
    container_name: vault-agent-cleaner
    restart: unless-stopped
    networks:
      - bykstack
    volumes:
      - vault-agent-creds:/agent/credentials:ro
      - vault-agent-token:/agent/out
      - ./vault/agents/cleaner/agent.hcl:/vault/agent-cleaner.hcl:ro
    command: ["vault", "agent", "-config=/vault/agent-cleaner.hcl", "-log-level=info"]
    environment:
      VAULT_ADDR: "http://vault:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /agent/out/token && test -s /agent/out/token"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      vault-init:
        condition: service_completed_successfully

  database:
    container_name: database
    image: postgres:14.1
    environment:
      - POSTGRES_USER=byk
      - POSTGRES_PASSWORD=01234
      - POSTGRES_DB=ckb_db
    ports:
      - 5432:5432
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - bykstack

  file-processing-api:
    container_name: file-processing-api
    build:
      context: ./file-processing
      dockerfile: Dockerfile
    ports:
      - 8888:8888
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - SOURCE_PATH=/app/data
      - S3_PRESIGNED_URL_EXPIRATION=${S3_PRESIGNED_URL_EXPIRATION:-3600}
      - S3_UPLOAD_URL_EXPIRATION=${S3_UPLOAD_URL_EXPIRATION:-3600}
      - AUTO_CLEANUP_COMPLETED_TASKS=${AUTO_CLEANUP_COMPLETED_TASKS:-true}
      - COMPLETED_TASK_CLEANUP_DELAY_MINUTES=${COMPLETED_TASK_CLEANUP_DELAY_MINUTES:-5}
      - PERIODIC_CLEANUP_INTERVAL_MINUTES=${PERIODIC_CLEANUP_INTERVAL_MINUTES:-60}
      - MAX_TASK_AGE_HOURS=${MAX_TASK_AGE_HOURS:-24}
    volumes:
      - ./scrapped-data:/scrapped-data
      - ./search-data:/app/data:rw
      - ./file-processing/logs:/app/logs:rw
      - ./file-processing/app:/app/app:rw
    networks:
      - bykstack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    cpus: "0.5"
    mem_limit: "512M"

  resql-users:
    container_name: resql-users
    image: resql
    depends_on:
      - database
    environment:
      - server.port=8087
      - sqlms.datasources.[0].name=byk
      - sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://171.22.247.13:5433/byk
      - sqlms.datasources.[0].username=byk
      - sqlms.datasources.[0].password=2nH09n6Gly
      - logging.level.org.springframework.boot=INFO
    ports:
      - 8087:8087
    volumes:
      - ./DSL/Resql:/DSL
    networks:
      - bykstack

  resql-ckb:
    container_name: resql-ckb
    image: resql
    depends_on:
      - database
    environment:
      - server.port=8090
      - sqlms.datasources.[0].name=byk
      - sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://database:5432/ckb_db
      - sqlms.datasources.[0].username=byk
      - sqlms.datasources.[0].password=01234
      - logging.level.org.springframework.boot=INFO
    ports:
      - 8090:8090
    volumes:
      - ./DSL/Resql:/DSL
    networks:
      - bykstack

  ruuter-internal:
    container_name: ruuter-internal
    image: ruuter
    environment:
      - application.cors.allowedOrigins=http://localhost:8086,http://localhost:8089,http://localhost:3001,http://localhost:3003,http://localhost:3004,http://localhost:8080
      - application.httpCodesAllowList=200,201,202,400,401,403,500
      - application.internalRequests.allowedIPs=127.0.0.1
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - application.logging.printStackTrace=true
      - application.internalRequests.disabled=true
      - server.port=8089
    volumes:
      - ./DSL/Ruuter.internal:/DSL
      - ./constants.ini:/app/constants.ini
    networks:
      - bykstack
    # expose instead of ports — ruuter-internal is internal only
    expose:
      - "8089"
    cpus: "0.5"
    mem_limit: "512M"

  cleaning-server:
    container_name: cleaning-server
    build:
      context: ./cleaning
    ports:
      - 8123:8123
    volumes:
      - ./scrapped-data:/scrapped-data
      - vault-agent-token:/agent/out:ro
    environment:
      - RUUTER_INTERNAL=http://ruuter-internal:8089
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN_PATH=/agent/out/token
      - VAULT_SECRET_PATH=llm/connections/azure_openai/cleaner
    networks:
      - bykstack
    depends_on:
      vault-agent-cleaner:
        condition: service_healthy

  rabbit-scrapper:
    image: rabbitmq:4-management
    container_name: rabbit-scrapper
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_DEFAULT_VHOST=scrapper
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - bykstack

  scheduler:
    container_name: scheduler
    build:
      context: ./scheduler
    ports:
      - "8124:8124"
    networks:
      - bykstack

volumes:
  opensearch-data:
  vault-data:
  vault-init-data:      # separate from vault-data — stores unseal keys and init flag only
  vault-logs:
  vault-agent-creds:
  vault-agent-token:
  # vault-agent-cleaner-token removed — was unused (agent writes to vault-agent-token)

networks:
  # vault-network removed — was declared but never attached to any service
  bykstack:
    name: bykstack
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400