    build:
      context: ./GUI
      dockerfile: Dockerfile.dev
    ports:
      - 3001:3001
    volumes:
      - /app/node_modules
      - ./GUI:/app
    networks:
      - bykstack
    cpus: "0.5"
    mem_limit: "1G"

  cron-manager:
    container_name: cron-manager
    image: cron-manager
    # user: root # This root user is only for local development due to multi container mounted volume permissions
    volumes:
      - ./DSL/CronManager:/DSL
    environment:
      - server.port=9010
    ports:
      - 9010:9010
    networks:
      - bykstack

  opensearch-node:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch-node
    environment:
      - node.name=opensearch-node
      - discovery.seed_hosts=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600
    networks:
      - bykstack

  search-service:
    container_name: search-service
    build:
      context: ./search-service
      dockerfile: Dockerfile
    environment:
      - OPENSEARCH_URL=http://opensearch-node:9200
      - DATA_PATH=/app/data
      - PORT=3000
    depends_on:
      - opensearch-node
    ports:
      - 3009:3000
    networks:
      - bykstack
    volumes:
      - ./search-data:/app/data
    restart: unless-stopped

  tim:
    container_name: tim
    image: tim
    depends_on:
      - tim-postgresql
    environment:
      - SECURITY_ALLOWLIST_JWT=ruuter,ruuter-internal,data-mapper,resql,tim,tim-postgresql,chat-widget,authentication-layer,127.0.0.1,::1
      - JWT_INTEGRATION_SIGNATURE_KEY_STORE_PASSWORD=defaultpassword
    ports:
      - 8085:8085
    networks:
      - bykstack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: "0.5"
    mem_limit: "512M"

  tim-postgresql:
    container_name: tim-postgresql
    image: postgres:14.1
    environment:
      - POSTGRES_USER=tim
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=tim
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./tim-db:/var/lib/postgresql/data
    ports:
      - 9876:5432
    networks:
      - bykstack

  scrapper-server:
    container_name: scrapper-server
    build:
      context: ./scrapper
      target: server
    ports:
      - 8080:8080
    volumes:
      - ./scrapped-data:/scrapped-data
      - ./scrapper:/app
    environment:
      - RUUTER_INTERNAL=http://ruuter-internal:8089
      - BROKER_URL=pyamqp://admin:admin@rabbit-scrapper/scrapper
    depends_on:
      - rabbit-scrapper
    networks:
      - bykstack

  scrapper-celery:
    container_name: scrapper-celery
    build:
      context: ./scrapper
      target: celery
    volumes:
      - ./scrapped-data:/scrapped-data
      - ./scrapper:/app
    environment:
      - RUUTER_INTERNAL=http://ruuter-internal:8089
      - BROKER_URL=pyamqp://admin:admin@rabbit-scrapper/scrapper
    depends_on:
      - rabbit-scrapper
    networks:
      - bykstack

  cleaning-server:
    container_name: cleaning-server
    build:
      context: .
      dockerfile: cleaning/Dockerfile
    ports:
      - 8123:8123
    volumes:
      - ./scrapped-data:/scrapped-data
      - vault-agent-token:/agent/out:ro
    environment:
      - RUUTER_INTERNAL=http://ruuter-internal:8089
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN_PATH=/agent/out/token
      - VAULT_SECRET_PATH=llm/connections/azure_openai/cleaner
    networks:
      - bykstack
    depends_on:
      vault-agent-cleaner:
        condition: service_healthy

  rabbit-scrapper:
    image: rabbitmq:4-management
    container_name: rabbit-scrapper
    entrypoint: ["sh", "-c", "mkdir -p /etc/rabbitmq/conf.d && echo 'deprecated_features.permit.transient_nonexcl_queues = true' > /etc/rabbitmq/conf.d/10-deprecated.conf && exec docker-entrypoint.sh rabbitmq-server"]
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_DEFAULT_VHOST=scrapper
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - bykstack

  scheduler:
    container_name: scheduler
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    ports:
      - "8124:8124"
    networks:
      - bykstack

volumes:
  opensearch-data:
  vault-data:
  vault-init-data:      # separate from vault-data — stores unseal keys and init flag only
  vault-logs:
  vault-agent-creds:
  vault-agent-token:
  # vault-agent-cleaner-token removed — was unused (agent writes to vault-agent-token)

networks:
  # vault-network removed — was declared but never attached to any service
  bykstack:
    name: bykstack
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400